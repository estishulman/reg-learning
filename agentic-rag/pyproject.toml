[project]
name = "agentic-knowledge-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["llama-index-core>=0.12,<0.15", "llama-index-embeddings-cohere>=0.4", "llama-index-vector-stores-pinecone>=0.4", "llama-index-llms-cohere>=0.4", "cohere>=5", "pinecone>=5", "gradio>=5", "python-dotenv>=1", "pydantic>=2"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
agentic-rag = "agentic_rag.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
